<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup &amp; Restore Data &bull; Admin Ruvia Furniture Makassar</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <!-- ADMIN TOPBAR (Loaded from admin/header.html) -->
  <div id="admin-header-placeholder"></div>

  <!-- ADMIN MAIN LAYOUT -->
  <div class="admin-layout">
    <!-- ADMIN SIDEBAR (Loaded from admin/sidebar.html) -->
    <div id="admin-sidebar-placeholder"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="admin-content-area">
      <section class="tab-panel active" id="tab-backup" style="display: block;">
        <div class="panel-header">
          <h1 class="panel-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Backup &amp; Restore Data</span>
          </h1>
          <p class="panel-subtitle">Unduh cadangan data website atau pulihkan data dari file JSON cadangan.</p>
        </div>

        <div class="admin-card">
          <div class="card-title-row">
            <div>
              <h2 class="card-title">Ekspor &amp; Impor Cadangan</h2>
              <p class="card-desc">Simpan cadangan konfigurasi produk, hero, dan promo ke komputer Anda dalam format JSON.</p>
            </div>
          </div>

          <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
            <button type="button" class="btn-adm btn-adm-outline" id="btn-export-json">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Download Backup JSON</span>
            </button>

            <label class="btn-adm btn-adm-outline" style="cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span>Upload Restore JSON</span>
              <input type="file" id="input-import-json" accept=".json" style="display: none;">
            </label>

            <button type="button" class="btn-adm btn-adm-danger" id="btn-reset-default">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
              <span>Reset ke Pengaturan Awal Toko</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-notice" id="admin-toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f8c320" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toast-message">Data berhasil disimpan!</span>
  </div>

  <script src="admin.js"></script>
</body>
</html>
