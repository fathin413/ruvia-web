<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrator &bull; Ruvia Furniture Makassar</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body style="margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1e1fab 0%, #0a0b4d 100%); font-family: 'Poppins', sans-serif;">

  <div class="login-card" style="margin: 1.5rem; box-shadow: 0 25px 60px rgba(0,0,0,0.45);">
    <div class="login-logo">ruvia<span>.</span></div>
    <h1 style="font-size: 1.2rem; font-weight: 700; color: #0f172a; margin: 0 0 0.35rem 0;">Login Administrator</h1>
    <p class="login-sub" style="margin-bottom: 1.5rem;">Panel Pengelola Konten &amp; Produk Backend</p>
    
    <form id="admin-login-form">
      <div class="form-group" style="text-align: left; margin-bottom: 1.25rem;">
        <label class="form-label" for="login-pin" style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Password / PIN Admin:</label>
        <input type="password" id="login-pin" class="form-input" placeholder="Masukkan password admin" required autofocus autocomplete="current-password" style="width: 100%; box-sizing: border-box;">
        <p class="form-hint" style="font-size: 0.775rem; color: #64748b; margin-top: 0.4rem; margin-bottom: 0;">Masukkan password administrator yang ditentukan di server (.env).</p>
      </div>

      <div id="login-error" style="color: #dc2626; font-size: 0.825rem; margin-bottom: 1.25rem; display: none; font-weight: 600; text-align: left; background: #fef2f2; border: 1px solid #fecaca; padding: 0.65rem 0.85rem; border-radius: 8px;">
        Password salah, silakan coba lagi.
      </div>

      <button type="submit" class="btn-adm btn-adm-primary" id="btn-submit-login" style="width: 100%; padding: 0.85rem; justify-content: center; font-size: 0.95rem; font-weight: 700; cursor: pointer;">
        <span>Masuk ke Dashboard</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <div style="margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1.25rem;">
      <a href="../index.html" style="font-size: 0.825rem; color: #64748b; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 500;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Kembali ke Website Utama</span>
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('admin-login-form');
      const loginPinInput = document.getElementById('login-pin');
      const loginError = document.getElementById('login-error');
      const btnSubmit = document.getElementById('btn-submit-login');

      function getApiUrl(endpoint) {
        if ((window.location.protocol === 'http:' || window.location.protocol === 'https:') && window.location.port === '3000') {
          return endpoint;
        }
        return 'http://localhost:3000' + endpoint;
      }

      function getAdminHeaders(extraHeaders = {}) {
        const headers = { ...extraHeaders };
        const token = sessionStorage.getItem('ruvia_admin_token');
        if (token) headers['x-admin-token'] = token;
        return headers;
      }

      // Jika sudah login, langsung arahkan ke dashboard
      fetch(getApiUrl('/api/admin/check'), { credentials: 'include', headers: getAdminHeaders() })
        .then(res => {
          if (res.ok) {
            window.location.replace('index.html');
          }
        })
        .catch(() => {});

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const entered = loginPinInput.value;
          if (!entered) return;

          btnSubmit.disabled = true;
          btnSubmit.style.opacity = '0.7';

          try {
            const res = await fetch(getApiUrl('/api/admin/login'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ password: entered })
            });

            const data = await res.json().catch(() => ({}));

            if (res.ok) {
              if (data.token) {
                sessionStorage.setItem('ruvia_admin_token', data.token);
              }
              if (loginError) loginError.style.display = 'none';
              window.location.replace('index.html');
            } else if (res.status === 429) {
              if (loginError) {
                loginError.textContent = data.error || 'Terlalu banyak percobaan gagal. Silakan coba lagi setelah 15 menit.';
                loginError.style.display = 'block';
              }
            } else {
              if (loginError) {
                loginError.textContent = data.error || 'Password admin salah, silakan coba lagi.';
                loginError.style.display = 'block';
              }
              loginPinInput.select();
            }
          } catch (err) {
            console.error('Error login admin:', err);
            if (loginError) {
              loginError.textContent = 'Gagal terhubung ke server backend. Pastikan server Node.js aktif di port 3000.';
              loginError.style.display = 'block';
            }
          } finally {
            btnSubmit.disabled = false;
            btnSubmit.style.opacity = '1';
          }
        });
      }
    });
  </script>
</body>
</html>
